services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: canopy-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: canopy
      POSTGRES_PASSWORD: ${PGPASSWORD:-canopy_dev_pass}
      POSTGRES_DB: ${PGDATABASE:-canopy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canopy -d canopy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: canopy_postgres_data
